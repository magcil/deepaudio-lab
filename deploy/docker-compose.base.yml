# Base compose file: ALL service definitions, build contexts, internal wiring.
# It publishes NO host ports and adds no GPU — each environment overlay layers
# those on (compose.local.yml, compose.gpu.yml, compose.prod.yml, ...).
#
# Relative paths (build contexts, volume mounts) are written relative to the
# REPO ROOT, so always invoke with `--project-directory .` from the repo root,
# e.g.:
#   docker compose --project-directory . \
#     -f deploy/docker-compose.base.yml -f deploy/docker-compose.local.yml \
#     --env-file deploy/env/local.env --profile app up -d

name: deepaudio

services:

  # ── Infrastructure (always up) ────────────────────────────────────────────

  db:
    image: postgres:16
    container_name: deepaudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: deepaudio-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: raw-audios, checkpoints, artifacts
    volumes:
      - seaweedfs_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: deepaudio-keycloak
    # Dev-mode default; the prod overlay overrides this with `start`.
    command: start-dev --health-enabled=true --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  redis:
    image: redis:7-alpine
    container_name: deepaudio-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application (gated behind the `app` profile) ──────────────────────────

  backend:
    build:
      context: ./backend
    container_name: deepaudio-backend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      keycloak:
        condition: service_started
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:8333}
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      CELERY_BROKER_URL: redis://redis:6379/0

  worker:
    build:
      context: ./backend
    container_name: deepaudio-worker
    restart: unless-stopped
    profiles: [app]
    command: celery -A worker.app.celery_app worker --loglevel=info --pool=solo --include=worker.training,worker.evaluation,worker.deployment
    # PyTorch DataLoader workers pass batches back through /dev/shm, which Docker
    # caps at 64 MB by default — independent of the VM's total RAM. With
    # num_workers > 0 this fills up and the kernel kills a worker
    # ("DataLoader worker ... killed by signal: Killed"). Raise it so batches fit.
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      CELERY_BROKER_URL: redis://redis:6379/0

  # Celery Beat scheduler — fires the periodic reaper (does no work itself).
  # Always built lean (no torch/deepaudiox).
  beat:
    build:
      context: ./backend
      args:
        ML_EXTRA: ""
        RUNTIME_LIBS: ""
    container_name: deepaudio-beat
    restart: unless-stopped
    profiles: [app]
    command: celery -A worker.app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      CELERY_BROKER_URL: redis://redis:6379/0

  # Maintenance worker — runs reaper tasks on a dedicated queue so they never
  # wait behind a long training job on the solo GPU worker. Always built lean.
  maintenance-worker:
    build:
      context: ./backend
      args:
        ML_EXTRA: ""
        RUNTIME_LIBS: ""
    container_name: deepaudio-maintenance
    restart: unless-stopped
    profiles: [app]
    command: celery -A worker.app.celery_app worker --loglevel=info --pool=solo --queues=maintenance --include=worker.maintenance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      CELERY_BROKER_URL: redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-deepaudiolab}
        # PUBLIC frontend client — the frontend/Dockerfile default is the
        # confidential backend client, which is wrong for the SPA.
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-deepaudiolab}
    container_name: deepaudio-frontend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      - backend

volumes:
  postgres_data:
  seaweedfs_data:
  keycloak_data:

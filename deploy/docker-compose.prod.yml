name: deepaudio-lab-prod

# Standalone single-server PRODUCTION compose (NOT a base+overlay). The only
# public service is the `edge` nginx reverse proxy (80/443); everything else
# stays on the internal Docker network. This file is GPU-agnostic; add the GPU
# overlay (deploy/docker-compose.gpu.yml, i.e. `make prod-gpu`) on a GPU host.
#
# Invoke from the repo root with --project-directory . so relative paths resolve:
#
# Bootstrap (first deploy — TLS certs don't exist yet):
#   1. mkdir -p deploy/nginx/certs certbot/www
#   2. Throwaway self-signed cert so nginx can start and serve the ACME challenge:
#        openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
#          -keyout deploy/nginx/certs/privkey.pem \
#          -out deploy/nginx/certs/fullchain.pem -subj "/CN=placeholder"
#   3. Bring up edge only:
#        docker compose --project-directory . -f deploy/docker-compose.prod.yml \
#          --env-file deploy/env/prod.env up -d edge
#   4. Obtain the real cert, then copy it where nginx reads it:
#        docker compose --project-directory . -f deploy/docker-compose.prod.yml \
#          --env-file deploy/env/prod.env run --rm certbot
#        cp certbot/conf/live/${DOMAIN}/fullchain.pem deploy/nginx/certs/
#        cp certbot/conf/live/${DOMAIN}/privkey.pem  deploy/nginx/certs/
#   5. Full stack:
#        docker compose --project-directory . -f deploy/docker-compose.prod.yml \
#          --env-file deploy/env/prod.env up -d --build
#
# Cert renewal (cron): `... run --rm certbot renew`, copy certs (step 4), then
# `... restart edge`.
#
# Required env vars: see deploy/env/prod.env.example. The SeaweedFS S3 identity
# keys in deploy/seaweedfs/s3.json must match AWS_ACCESS_KEY_ID/SECRET there.

services:

  # ── Edge reverse proxy (only service with public ports) ───────────────────
  edge:
    image: nginx:1.27-alpine
    container_name: deepaudio-edge
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro   # ACME HTTP-01 challenge files
    depends_on:
      - frontend
      - backend
      - keycloak
      - seaweedfs

  # ── Certbot — run once to obtain certs, then for renewals (webroot) ───────
  certbot:
    image: certbot/certbot
    container_name: deepaudio-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: >-
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${DOMAIN}
      -d auth.${DOMAIN}
      -d storage.${DOMAIN}

  # ── Application ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_KEYCLOAK_URL: https://auth.${DOMAIN}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        # The app's single (public) Keycloak client, used by the SPA for OIDC login.
        VITE_KEYCLOAK_CLIENT_ID: deepaudiolab
    container_name: deepaudio-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  backend:
    build:
      context: ./backend
    container_name: deepaudio-backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      S3_PUBLIC_URL: https://storage.${DOMAIN}
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DATA_BUCKET: ${DATA_BUCKET:-raw-audios}
      CHECKPOINTS_BUCKET: ${CHECKPOINTS_BUCKET:-checkpoints}
      ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
      # This file has no env_file, so EVERY tunable must be forwarded explicitly
      # or it falls back to the code default and .env.prod can't control it.
      USER_SPACE_LIMIT: ${USER_SPACE_LIMIT:-10737418240}
      TOTAL_STORAGE_LIMIT: ${TOTAL_STORAGE_LIMIT:-107374182400}
      MAX_SEGMENT_DURATION: ${MAX_SEGMENT_DURATION:-10.0}
      MAX_EPOCHS: ${MAX_EPOCHS:-100}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-128}
      MAX_NUM_WORKERS: ${MAX_NUM_WORKERS:-4}
      MAX_USER_TRAININGS: ${MAX_USER_TRAININGS:-1}
      MAX_SYSTEM_TRAININGS: ${MAX_SYSTEM_TRAININGS:-4}
      MAX_USER_EVALUATIONS: ${MAX_USER_EVALUATIONS:-2}
      MAX_SYSTEM_EVALUATIONS: ${MAX_SYSTEM_EVALUATIONS:-4}
      MAX_USER_JOBS: ${MAX_USER_JOBS:-2}
      MAX_SYSTEM_JOBS: ${MAX_SYSTEM_JOBS:-4}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
      JOB_HEARTBEAT_TTL_SECONDS: ${JOB_HEARTBEAT_TTL_SECONDS:-180}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-300}
      DATASET_RETENTION_ENABLED: ${DATASET_RETENTION_ENABLED:-false}
      DATASET_RETENTION_SECONDS: ${DATASET_RETENTION_SECONDS:-2592000}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Browser JWTs carry the PUBLIC issuer (KC_HOSTNAME); the backend validates
      # against the same URL. extra_hosts resolves it internally via the edge.
      KEYCLOAK_SERVER_URL: https://auth.${DOMAIN}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    extra_hosts:
      - "auth.${DOMAIN}:host-gateway"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  worker:
    build:
      context: ./backend
    container_name: deepaudio-worker
    restart: unless-stopped
    command: celery -A worker.app.celery_app worker --loglevel=info --pool=solo --include=worker.training,worker.evaluation,worker.deployment
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      S3_PUBLIC_URL: https://storage.${DOMAIN}
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DATA_BUCKET: ${DATA_BUCKET:-raw-audios}
      CHECKPOINTS_BUCKET: ${CHECKPOINTS_BUCKET:-checkpoints}
      ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
      # Heartbeat WRITER: training/eval tasks set hb:{run_id} with this TTL and
      # refresh on this interval. Readers (backend, reaper) only check existence.
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
      JOB_HEARTBEAT_TTL_SECONDS: ${JOB_HEARTBEAT_TTL_SECONDS:-180}
      CELERY_BROKER_URL: redis://redis:6379/0
      KEYCLOAK_SERVER_URL: https://auth.${DOMAIN}
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"

  beat:
    build:
      context: ./backend
      args:
        ML_EXTRA: ""
        RUNTIME_LIBS: ""
    container_name: deepaudio-beat
    restart: unless-stopped
    command: celery -A worker.app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Beat builds the reaper schedule from this at startup (worker/app.py).
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-300}
      CELERY_BROKER_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  maintenance-worker:
    build:
      context: ./backend
      args:
        ML_EXTRA: ""
        RUNTIME_LIBS: ""
    container_name: deepaudio-maintenance
    restart: unless-stopped
    command: celery -A worker.app.celery_app worker --loglevel=info --pool=solo --queues=maintenance --include=worker.maintenance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_API: http://seaweedfs:8333
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DATA_BUCKET: ${DATA_BUCKET:-raw-audios}
      CHECKPOINTS_BUCKET: ${CHECKPOINTS_BUCKET:-checkpoints}
      ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
      # The reaper runs HERE — without these it uses the code default (retention
      # disabled) even if .env.prod enables it.
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-300}
      DATASET_RETENTION_ENABLED: ${DATASET_RETENTION_ENABLED:-false}
      DATASET_RETENTION_SECONDS: ${DATASET_RETENTION_SECONDS:-2592000}
      CELERY_BROKER_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  # ── Infrastructure (internal network only — NO published host ports) ──────
  db:
    image: postgres:16
    container_name: deepaudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  # Dedicated database for Keycloak (production must not use the dev store).
  keycloak-db:
    image: postgres:16
    container_name: deepaudio-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: deepaudio-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"                 # TLS terminated at the edge proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    expose:
      - "8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

  redis:
    image: redis:7-alpine
    container_name: deepaudio-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"


  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: deepaudio-seaweedfs
    restart: unless-stopped
    # Explicit command: master + volume + filer (-filer, required for S3) + S3.
    # -s3.config enables S3 AUTHENTICATION — without it SeaweedFS accepts ALL
    # requests, leaving the store publicly writable via storage.${DOMAIN}. Keep
    # the keys in deploy/seaweedfs/s3.json in sync with AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY in .env.prod.
    # -master.volumePreallocate=false overrides the image default (which reserves
    # ~1 GiB per volume file up front); volumes now grow with actual data. Buckets
    # are created by the backend on startup (ensure_buckets), so no S3_BUCKET env.
    command: server -dir=/data -master.volumePreallocate=false -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer.port=8888 -master.port=9333
    volumes:
      - seaweedfs_data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "8"

volumes:
  postgres_data:
  keycloak_db_data:
  seaweedfs_data:

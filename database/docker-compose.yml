services:
  db:
    image: postgres:16
    container_name: deepaudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepaudio
      POSTGRES_PASSWORD: deepaudio
      POSTGRES_DB: deepaudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
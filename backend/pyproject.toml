[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.42.0",
    "celery[redis]>=5.3",
    "boto3>=1.43.8",
    "requests>=2.32",
    # [crypto] pulls in `cryptography`, required for RS256 JWT signature
    # verification. It used to arrive transitively via python-keycloak; make it
    # explicit now that python-keycloak is gone.
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.3",
    "python-multipart>=0.0.29",
]

# Heavy ML stack (deepaudio-x pulls in torch + librosa). Installed only in
# images that run training/evaluation/deployment or the API; the lean maintenance
# worker and beat scheduler build WITHOUT this extra.
[project.optional-dependencies]
ml = [
    "deepaudio-x>=0.4.7",
    "torch",
    "torchvision",
    "torchaudio",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "pytest>=8.4.2",
    "ruff>=0.15.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I"
]
ignore = ["UP042"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]
